<!DOCTYPE html>
<html>
<head>
<title>Garden City University</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Garden City University</h1>
<p>Welcome to the university information portal.</p>

<!-- Chatbot Button -->
<div id="chatbot-icon" onclick="toggleChat()">
💬
</div>

<!-- Chatbot Window -->
<div id="chatbot">

<div class="chat-header">
University Assistant
<span onclick="toggleChat()">✖</span>
</div>

<div id="chatbox" class="chat-box">
<div class="bot">
Hello! I can help you with admission, courses, fees, hostel and location.
</div>
</div>

<div class="input-area">
<input id="userInput" placeholder="Ask something...">
<button onclick="sendMessage()">Send</button>
</div>

</div>

<script src="chatbot.js"></script>

</body>
</html>
